name: Build Minecraft Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Find and Build Mod
      run: |
        # Inteligentne wykrywanie folderu z projektem (tam gdzie jest settings.gradle)
        TARGET_DIR=$(find . -name "settings.gradle" -exec dirname {} \;)
        echo "Znaleziono katalog projektu: $TARGET_DIR"
        cd "$TARGET_DIR"
        
        # Automatyczne generowanie plików startowych gradlew, jeśli nie zostały dodane
        if [ ! -f "gradlew" ]; then
          echo "Generowanie brakującego wrappera Gradle..."
          gradle wrapper --gradle-version=8.9
        fi
        
        chmod +x gradlew
        ./gradlew build --no-daemon

    - name: Upload Mod Artifacts (.jar)
      uses: actions/upload-artifact@v4
      with:
        name: production-libs
        path: "**/build/libs/*.jar"
