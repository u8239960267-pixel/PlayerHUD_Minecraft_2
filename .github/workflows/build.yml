name: Build PlayerHUD for Minecraft 1.21.11

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          # WSKAZANIE WŁAŚCIWEGO FOLDERU Z PLIKAMI MODA:
          build-root-directory: PlayerHUD_Fabric_1.21.11

      - name: Build mod
        # Uruchomienie komendy bezpośrednio w podfolderze projektu
        run: cd PlayerHUD_Fabric_1.21.11 && gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PlayerHUD-Fabric-1.21.11
          path: PlayerHUD_Fabric_1.21.11/build/libs/*.jar
          if-no-files-found: error
