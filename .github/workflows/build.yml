name: Build PlayerHUD for Minecraft 1.21.11

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mod
        run: |
          # Wejście bezpośrednio do prawidłowego folderu projektu
          cd PlayerHUD_Fabric_1.21.11
          
          # Generowanie poprawnego środowiska startowego Gradle 8.9
          gradle wrapper --gradle-version=8.9
          
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PlayerHUD-Fabric-1.21.11
          path: PlayerHUD_Fabric_1.21.11/build/libs/*.jar
          if-no-files-found: error
