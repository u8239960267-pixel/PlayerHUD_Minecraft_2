
name: Build PlayerHUD 1.21.11

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Skonfiguruj Javę 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Skonfiguruj Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Buduj moda
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon
          else
            echo "Brak pliku gradlew w głównym katalogu!"
            exit 1
          fi

      - name: Udostępnij plik JAR
        uses: actions/upload-artifact@v4
        with:
          name: PlayerHUD-Fabric-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
