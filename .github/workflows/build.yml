
name: Build PlayerHUD 1.21.11

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Skonfiguruj Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Zainstaluj Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Zbuduj moda
        run: gradle build --no-daemon

      - name: Udostępnij plik JAR
        uses: actions/upload-artifact@v4
        with:
          name: PlayerHUD-Fabric-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
